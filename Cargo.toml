[package]
name = "pojo2json"
version = "0.1.0"
edition = "2021"
description = "Parse Java source files and extract POJO structure to JSON"

[dependencies]
tree-sitter = "0.27"
tree-sitter-java = "0.23.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
